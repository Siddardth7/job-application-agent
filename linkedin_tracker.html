<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>LinkedIn Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  color-scheme: light;
  --bg:#eef1ec; --panel:#ffffff; --panel-2:#f4f6f8;
  --ink:#0e1621; --muted:#3d4a57; --faint:#5d6b7a; --line:#d5dbe1;
  --edge:#0e1621; --accent:#0a66c2; --accent-soft:#e3f0fb; --accent-ink:#084b8f;
  --direct:#7c4d86; --staffing:#a06a1b; --drop:#7a848d;
  --due:#8a4b00; --pos:#1b6b3a; --neg:#a32a22; --danger:#b3261e; --danger-soft:#fbe7e5;
  --sans:'Inter','SF Pro Text',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;
  --r:9px; --shadow:4px 4px 0 var(--edge); --shadow-sm:2px 2px 0 var(--edge);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;font-weight:450;-webkit-font-smoothing:antialiased}
a{color:var(--accent-ink);font-weight:600}
h1,h2,h3{margin:0}
.eyebrow{font-size:12px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);font-weight:800}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hide{display:none!important}
header{background:var(--panel);border-bottom:2px solid var(--edge);padding:15px 22px}
.htop{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.brand{font-size:21px;font-weight:900;letter-spacing:-.2px}
.brand small{display:block;font-weight:700;color:var(--faint);font-size:12px;letter-spacing:.02em;margin-top:2px}
.clock{font-size:12.5px;color:var(--muted);text-align:right;font-weight:600}
.clock b{display:block;color:var(--ink);font-size:15px;font-weight:800}
.badges{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap;align-items:center}
.livepill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:20px;border:1.5px solid;cursor:pointer}
.livepill.on{color:#0c5b2e;background:#e2f2e8;border-color:#1b6b3a}
.livepill.off{color:#7a5c16;background:#f7efdb;border-color:#a06a1b}
.livepill .dot{width:7px;height:7px;border-radius:50%}
.livepill.on .dot{background:#1b6b3a}.livepill.off .dot{background:#a06a1b}
.reload{font-size:11.5px;font-weight:800;padding:2px 10px;border-radius:20px;border:1.5px solid var(--edge);background:#fff;cursor:pointer;color:var(--ink);font-family:inherit}
.reload:hover{background:var(--accent-soft)}
.tabs{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap}
.tab{font-size:13.5px;font-weight:800;padding:9px 18px;border:2px solid var(--edge);background:#fff;border-radius:7px;cursor:pointer;color:var(--ink)}
.tab:hover{box-shadow:var(--shadow-sm)}
.tab[aria-selected="true"]{background:var(--accent);color:#fff;box-shadow:var(--shadow-sm)}
main{max-width:1280px;margin:0 auto;padding:20px 22px 60px}
.panel{display:none} .panel.active{display:block}
body:has(#tracker.active){overflow:hidden}
body:has(#tracker.active) main{max-width:none;width:100%;padding:14px 12px 0}
body:has(#tracker.active) footer{display:none}
.srcnote{background:var(--panel);border:2px solid var(--edge);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:11px 15px;color:var(--muted);font-size:13px;font-weight:500;margin-bottom:16px}
.srcnote b{color:var(--ink)}
.srcnote input{padding:8px 10px;border:2px solid var(--edge);border-radius:6px;font-family:var(--mono);font-size:12px;min-width:320px;max-width:100%}
.card{background:var(--panel);border:2px solid var(--edge);border-radius:var(--r);box-shadow:var(--shadow)}
.kpis{display:block;margin-bottom:18px}
.kpigroup h4{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:0 0 7px 2px}
.kpirow{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:11px}
@media(max-width:900px){.kpirow{grid-template-columns:repeat(3,1fr)}}
@media(max-width:480px){.kpirow{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--panel);border:2px solid var(--edge);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:13px 14px}
.kpi .n{font-variant-numeric:tabular-nums;font-size:28px;font-weight:900;letter-spacing:-.02em;line-height:1}
.kpi .l{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.25;font-weight:700}
.kpi.accent{background:var(--accent)}.kpi.accent .n,.kpi.accent .l{color:#fff}
.kpi.warn{background:var(--danger)}.kpi.warn .n,.kpi.warn .l{color:#fff}
.block{padding:16px 18px}
.dash-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-bottom:18px}
@media(max-width:820px){.dash-grid{grid-template-columns:1fr}}
.block .eyebrow{display:block;margin-bottom:12px}
.dist{display:flex;flex-direction:column;gap:9px}
.dist .drow{display:grid;grid-template-columns:128px 1fr 36px;align-items:center;gap:10px}
.dist .lab{font-size:13px;font-weight:600}
.dist .track{background:var(--panel-2);border-radius:20px;height:14px;overflow:hidden;border:1px solid var(--line)}
.dist .track>i{display:block;height:100%;border-radius:20px}
.dist .val{font-size:13.5px;text-align:right;font-weight:800}
.dist .grp-lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:800;margin:10px 0 1px}
.dist .grp-lab:first-child{margin-top:0}
.recent-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.recent-row:last-child{border-bottom:none}
.recent-row:hover .recent-title{color:var(--accent-ink)}
.recent-date{font-size:12.5px;color:var(--faint);white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums}
.recent-title{font-size:13.5px;flex:1;font-weight:600}
.recent-n{font-size:12px;color:var(--muted);font-weight:700}
.stagepill{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:20px;text-transform:uppercase;border:1.5px solid var(--line);background:var(--panel-2);color:var(--muted);white-space:nowrap}
.stagepill.st-applied,.stagepill.st-offer,.stagepill.st-shortlisted{background:#e2f2e8;color:var(--pos);border-color:#bce0c9}
.stagepill.st-pending,.stagepill.st-referral-pending{background:#eaeef2;color:#3c4b57;border-color:#d0d8de}
.stagepill.st-interviewing{background:#e3f0fb;color:var(--accent-ink);border-color:#b6d3f5}
.stagepill.st-dropped,.stagepill.st-rejected,.stagepill.st-expired{background:#fbe4e2;color:var(--neg);border-color:#f0c4bf}
.chip{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:20px;white-space:nowrap;border:1.5px solid transparent}
.chip.direct-apply{background:#efe4f1;color:var(--direct);border-color:#ddc3e1}
.chip.staffing{background:#f3e9d6;color:var(--staffing);border-color:#e6d3ab}
.chip.referral,.chip.outreach{background:var(--accent-soft);color:var(--accent-ink);border-color:#b6d3f5}
.chip.t1{background:#e0edfb;color:#08417a;border-color:#bcd6f2}
.chip.t2{background:#e9edf0;color:#3c4b57;border-color:#d0d8de}
.score-pill{font-weight:900;font-variant-numeric:tabular-nums}
.score-pill.hi{color:var(--accent)}.score-pill.mid{color:var(--direct)}.score-pill.lo{color:var(--drop)}
.od-tag{font-size:10px;font-weight:900;color:#fff;background:var(--danger);padding:1px 7px;border-radius:20px}
.due-tag{font-size:10px;font-weight:900;color:#fff;background:var(--due);padding:1px 7px;border-radius:20px}
/* tracker toolbar */
.tbl-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tbl-tools select,.tbl-tools input{padding:7px 10px;border:2px solid var(--edge);border-radius:6px;background:#fff;font-size:13px;font-family:inherit;font-weight:600}
.tbl-tools input[type=text]{min-width:170px}
.tbl-tools input[type=number]{width:70px}
.tbl-tools label{font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--faint);font-weight:800}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer;font-weight:700}
.chipbtn{padding:6px 13px;border:2px solid var(--edge);border-radius:999px;background:#fff;cursor:pointer;font-size:12.5px;color:var(--ink);font-weight:800;text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-family:inherit}
.chipbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.count{font-size:12px;color:var(--faint);margin:0 0 8px;text-transform:uppercase;letter-spacing:.03em;font-weight:800}
/* tracker sheet: dense, full-width, sticky header + row numbers */
.tbl-scroll{overflow:auto;border:2px solid var(--edge);border-radius:var(--r);background:var(--panel)}
#tracker .tbl-scroll{height:calc(100vh - 236px);min-height:420px;border-radius:6px;box-shadow:none}
/* styled scrollbars are always drawn (never macOS overlay), so the bottom bar shows like the right one */
#tracker .tbl-scroll::-webkit-scrollbar{width:12px;height:12px}#tracker .tbl-scroll::-webkit-scrollbar-thumb{background:#b9c2d0;border-radius:6px;border:2px solid var(--panel)}#tracker .tbl-scroll::-webkit-scrollbar-track{background:var(--panel)}#tracker .tbl-scroll{scrollbar-width:thin;scrollbar-color:#b9c2d0 var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
#tracker table{min-width:1250px;font-size:12.5px;line-height:1.15}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--faint);font-weight:800;background:var(--panel-2);cursor:pointer;white-space:nowrap}
#tracker thead{position:sticky;top:0;z-index:3}
#tracker th{height:30px;background:var(--accent);color:#fff;border-right:1px solid var(--accent-ink);border-bottom:2px solid var(--edge);padding:5px 7px;font-size:12px;letter-spacing:0;text-transform:none;text-align:center}
#tracker th:hover{background:var(--accent-ink)}
#tracker td{height:27px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px 6px;white-space:nowrap;vertical-align:middle}
#tracker tbody tr:nth-child(even){background:var(--panel-2)}
#tracker tbody tr:hover{background:var(--accent-soft)}
#tracker tr.od td{background:var(--danger-soft)}
#tracker .rownum{position:sticky;left:0;z-index:2;width:38px;min-width:38px;max-width:38px;text-align:center;background:var(--panel-2);color:var(--muted);font-variant-numeric:tabular-nums}
#tracker th.rownum{z-index:4;background:var(--accent);color:#fff}
#tracker .xbtn{width:26px;min-width:26px;text-align:center;cursor:pointer;font-weight:900;color:var(--accent-ink);user-select:none}
#tracker select.mini{height:21px;min-width:110px;padding:1px 22px 1px 7px;border:1px solid var(--edge);border-radius:999px;font-size:11px;line-height:1;font-weight:800;background:#fff;cursor:pointer;font-family:inherit}
#tracker select.mini:disabled{opacity:.5;cursor:progress}
#tracker select.st-rejected{background:#f8d7da;border-color:#c73b46;color:#8f1620}
#tracker select.st-interviewing{background:var(--accent);border-color:var(--accent-ink);color:#fff}
#tracker select.st-shortlisted{background:#d9f2df;border-color:#69a979;color:#245f35}
#tracker select.st-offer{background:#1b6b3a;border-color:#124a28;color:#fff}
#tracker select.st-applied{background:var(--accent-soft);border-color:#6e9bc5;color:var(--accent-ink)}
#tracker select.st-pending,#tracker select.st-referral-pending{background:#fff0c7;border-color:#c49a37;color:#725514}
#tracker select.st-dropped,#tracker select.st-expired{background:#e5e7ea;border-color:#8d949b;color:#4d545b}
/* expanded detail row */
#tracker tr.xrow td{white-space:normal;background:#fff;border-bottom:2px solid var(--edge);padding:10px 14px 12px}
#tracker tr.xrow td>div{position:sticky;left:12px;max-width:calc(100vw - 60px)}   /* stays in view while the sheet scrolls sideways */
.xgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:12px 28px}
@media(max-width:900px){.xgrid{grid-template-columns:1fr}}
.xgrid h4{margin:0 0 7px;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);font-weight:800}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px}
.kv .k{font-size:11px;text-transform:uppercase;color:var(--faint);font-weight:800;white-space:nowrap}
.kv span:not(.k){font-weight:600;word-break:break-all}
.notebox{width:100%;font-family:var(--sans);font-size:13px;padding:8px 10px;border:2px solid var(--edge);border-radius:7px;background:#fff;color:var(--ink);resize:vertical;font-weight:500;line-height:1.5}
.notebox:focus{outline:none;border-color:var(--accent)}
.savebtn{font-size:12.5px;font-weight:800;padding:6px 14px;border:2px solid var(--edge);border-radius:6px;background:var(--accent-soft);color:var(--accent-ink);cursor:pointer;margin-top:6px;font-family:inherit}
.savebtn:hover{box-shadow:2px 2px 0 var(--edge)}
.note-hint{font-size:11px;color:var(--faint);font-weight:600;margin-left:8px}
.flag{color:var(--due);font-size:12px;font-weight:800;margin-top:8px}
.empty{color:var(--faint);text-align:center;padding:60px 20px;font-size:13.5px;font-weight:600}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:80}
.toast{background:#fff;border:2px solid var(--edge);border-radius:8px;box-shadow:var(--shadow-sm);padding:10px 14px;font-size:13px;font-weight:700;max-width:340px;animation:tin .16s}
.toast.ok{border-color:var(--pos)} .toast.ok b{color:var(--pos)}
.toast.err{border-color:var(--danger)} .toast.err b{color:var(--danger)}
.toast .sub{font-weight:500;color:var(--muted);font-size:11.5px;margin-top:2px;font-family:var(--mono)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
footer{margin-top:26px;font-size:12px;color:var(--faint);text-align:center;font-weight:600}
</style></head><body>
<header>
  <div class="htop">
    <div>
      <div class="brand">LinkedIn Tracker <small>your LinkedIn network · live from the linkedin-memory Supabase project</small></div>
      <div class="badges"><span class="livepill off" id="livepill" title="click to change the key"><span class="dot"></span><span id="livetxt">connecting…</span></span>
        <button class="reload" id="reload" title="re-read Supabase">↻ Reload data</button></div>
    </div>
    <div class="clock">today <b id="today-date"></b><span style="font-size:11px;color:var(--faint)" id="projname"></span></div>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true"  data-tab="dashboard">Dashboard</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="tracker">Tracker</button>
  </nav>
</header>
<main>
  <div class="srcnote" id="srcnote"></div>
  <section class="panel active" id="dashboard" role="tabpanel">
    <section class="kpis" id="kpis"></section>
    <div class="dash-grid">
      <div class="card block"><span class="eyebrow">Distribution</span><div class="dist" id="dist"></div></div>
      <div class="card block"><span class="eyebrow">Last spoke with</span><div id="recent"></div></div>
    </div>
  </section>
  <section class="panel" id="tracker" role="tabpanel">
    <div class="tbl-tools" id="tools"></div><div class="count" id="count"></div>
    <div class="tbl-scroll"><table id="table"></table></div>
  </section>
  <footer>Supabase is the record; this page is a live view of it. Changing a Status writes straight back to Supabase.</footer>
</main>
<div id="toasts"></div>
<script>
const SUPABASE_URL="https://chsrkysjongzgdbwqhlu.supabase.co";
const KEY_STORE='job_tracker.supabase_key';   // same slot as job_tracker.html: one paste serves both
const STAGES=['none','connected','talked','asked','referred','went cold','declined','wrong contact'];
const DEAD=new Set(['went cold','declined','wrong contact']);
const TODAY=new Date().toLocaleDateString('en-CA');
let ALL=[], byKey={}, seenAt=0;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const day=t=>t?String(t).slice(0,10):'';
const stCls=s=>'st-'+({none:'pending',connected:'applied',talked:'interviewing',asked:'shortlisted',referred:'offer','went cold':'dropped',declined:'rejected','wrong contact':'expired'}[s]||'pending');
$('#today-date').textContent=TODAY;
$('#projname').textContent=SUPABASE_URL.replace(/^https?:\/\//,'');

function getKey(){try{return localStorage.getItem(KEY_STORE)||'';}catch(e){return '';}}
function setKey(k){try{if(k)localStorage.setItem(KEY_STORE,k);else localStorage.removeItem(KEY_STORE);}catch(e){}}
function askKey(msg){
  $('#livepill').className='livepill off';$('#livetxt').textContent='no key';
  $('#srcnote').innerHTML=`<b>${esc(msg||'Connect this page to your Supabase project.')}</b><br>
    Paste your Supabase service_role key (the SUPABASE_KEY in your .env) — stored only in this browser, never in this file. LinkedIn data is not readable with the anon key.<br>
    <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><input type="password" id="keyin" placeholder="paste SUPABASE_KEY from your .env">
    <button class="chipbtn on" id="keygo">Connect</button></div>`;
  const go=()=>{setKey($('#keyin').value.trim());boot();};
  $('#keygo').onclick=go;$('#keyin').onkeydown=e=>{if(e.key==='Enter')go();};
}
$('#livepill').onclick=()=>askKey('Change the key for this page.');
$('#reload').onclick=()=>boot();

async function rpc(fn,body,qs){
  const key=getKey();
  const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}${qs||''}`,{method:'POST',headers:{apikey:key,Authorization:'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  if(!r.ok){const e=new Error((r.status===401||r.status===403)?'Key rejected ('+r.status+')':'HTTP '+r.status+' '+(await r.text()).slice(0,160));e.status=r.status;throw e;}
  return r.status===204?null:r.json().catch(()=>null);
}
// PostgREST caps a response at 1000 rows, so page until a short page comes back
async function loadAll(){let out=[];for(let off=0;;off+=1000){const p=await rpc('linkedin_tracker_contacts',{},`?limit=1000&offset=${off}`);out=out.concat(p);if(p.length<1000)return out;}}
async function boot(){
  if(!getKey())return askKey();
  $('#livetxt').textContent='loading…';
  try{ALL=await loadAll();}
  catch(e){if(e.status===401||e.status===403){setKey('');return askKey('That key was rejected — paste it again.');}
    $('#livepill').className='livepill off';$('#livetxt').textContent='offline';
    $('#srcnote').innerHTML='<b>Could not reach Supabase.</b> '+esc(e.message)+' — check your connection, then reload.';return;}
  byKey=Object.fromEntries(ALL.map(c=>[c.key,c]));seenAt=Date.now();
  $('#livepill').className='livepill on';$('#livetxt').textContent=`live · ${ALL.length} contacts`;
  const latestConnection=ALL.filter(c=>c.is_connection&&c.connected_on).map(c=>day(c.connected_on)).sort().at(-1)||'unknown';
  $('#srcnote').innerHTML='<b>Live from Supabase.</b> '+ALL.length.toLocaleString()+' contacts · latest connection '+esc(latestConnection)+'. Status changes save immediately; use ↻ Reload to see updates made elsewhere.';
  renderAll();
}
function renderAll(){renderKPIs();renderDist();renderRecent();renderTools();renderTable();}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&getKey()&&Date.now()-seenAt>30000)boot();});

function toast(msg,kind,sub){const el=document.createElement('div');el.className='toast '+(kind||'ok');
  el.innerHTML=`<b>${esc(msg)}</b>${sub?`<div class="sub">${esc(sub)}</div>`:''}`;
  $('#toasts').appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300);},kind==='err'?4200:2200);}
function gotoTab(id){$$('.tab').forEach(x=>x.setAttribute('aria-selected',x.dataset.tab===id));$$('.panel').forEach(x=>x.classList.toggle('active',x.id===id));}
$$('.tab').forEach(t=>t.onclick=()=>gotoTab(t.dataset.tab));

/* ---- status write: save_contact_state replaces the whole state row, so send every field back unchanged except stage ---- */
async function doStage(key,ns,sel,prev){
  const c=byKey[key];sel.disabled=true;
  try{
    await rpc('save_contact_state',{p_key:key,p_stage:ns,p_important:c.important,p_needs_reply:c.needs_reply,p_awaiting_reply:c.awaiting_reply,
      p_poc_secured:c.poc_secured,p_tags:c.tags,p_notes:c.notes,p_follow_up_date:c.follow_up_date,p_relationship_score:c.relationship_score,p_resolved_at:c.resolved_at});
    c.stage=ns;renderKPIs();renderDist();toast(`${c.full_name} → ${ns}`,'ok','saved to Supabase');
  }catch(e){toast('Save failed','err',e.message);sel.value=prev;}
  finally{sel.disabled=false;}
}

/* ---- Dashboard ---- */
function renderKPIs(){
  const n=f=>ALL.filter(f).length;
  const due=n(c=>c.follow_up_date&&c.follow_up_date<=TODAY&&!DEAD.has(c.stage));
  const cards=[{n:ALL.length,l:'Contacts'},{n:n(c=>c.is_connection),l:'Connections'},{n:n(c=>c.msg_sent>0),l:'Messaged',cls:'accent'},
    {n:n(c=>c.msg_recv>0),l:'Replied to you'},{n:n(c=>c.needs_reply),l:'Needs your reply'},{n:n(c=>c.stage==='referred'),l:'Referred'},{n:due,l:'Follow-ups due',cls:due?'warn':''}];
  $('#kpis').innerHTML=`<div class="kpigroup"><h4>LinkedIn Network</h4><div class="kpirow" style="--cols:${cards.length}">`
    +cards.map(c=>`<div class="kpi ${c.cls||''}"><div class="n">${c.n}</div><div class="l">${esc(c.l)}</div></div>`).join('')+`</div></div>`;
}
function renderDist(){
  const tot=ALL.length||1, col={none:'var(--drop)',connected:'var(--accent)',talked:'var(--accent-ink)',asked:'var(--pos)',referred:'var(--pos)','went cold':'var(--drop)',declined:'var(--neg)','wrong contact':'var(--drop)'};
  const bar=(l,v,c)=>`<div class="drow"><span class="lab">${esc(l)}</span><span class="track"><i style="width:${v/tot*100}%;background:${c}"></i></span><span class="val">${v}</span></div>`;
  let h='<div class="grp-lab">By status</div>';
  [...STAGES,...new Set(ALL.map(c=>c.stage).filter(s=>!STAGES.includes(s)))].forEach(s=>{const v=ALL.filter(c=>c.stage===s).length;if(v)h+=bar(s,v,col[s]||'var(--drop)');});
  const rel={};ALL.forEach(c=>(c.relevance||[]).forEach(r=>rel[r]=(rel[r]||0)+1));
  h+='<div class="grp-lab">By relevance</div>';Object.entries(rel).sort((a,b)=>b[1]-a[1]).forEach(([r,v])=>h+=bar(r,v,'var(--accent)'));
  $('#dist').innerHTML=h;
}
function renderRecent(){
  const rows=ALL.filter(c=>c.last_msg_at).sort((a,b)=>b.last_msg_at.localeCompare(a.last_msg_at)).slice(0,10);
  $('#recent').innerHTML=rows.map(c=>`<div class="recent-row" data-k="${esc(c.key)}"><span class="recent-date">${esc(day(c.last_msg_at).slice(5))}</span>
    <span class="recent-title">${esc(c.full_name)} <span style="color:var(--faint);font-weight:500">· ${esc(c.company)}</span></span>
    <span class="recent-n"><span class="stagepill ${stCls(c.stage)}">${esc(c.stage)}</span></span></div>`).join('')||'<div class="empty">No messages yet.</div>';
  $$('#recent .recent-row').forEach(r=>r.onclick=()=>{gotoTab('tracker');Object.assign(f,{stage:'',rel:'',q:byKey[r.dataset.k].full_name,dead:true});expanded=r.dataset.k;renderTools();renderTable();});
}

/* ---- Tracker ---- */
const f={stage:'',rel:'',q:'',dead:false};
let sort={k:'last_msg_at',dir:-1}, expanded=null;
function renderTools(){
  const opt=(v,s)=>v.map(x=>`<option ${x===s?'selected':''}>${esc(x)}</option>`).join('');
  const rels=[...new Set(ALL.flatMap(c=>c.relevance||[]))].sort();
  $('#tools').innerHTML=`<label>Status</label><select id="t-stage"><option value="">all active</option>${opt(STAGES,f.stage)}</select>
    <label>Relevance</label><select id="t-rel"><option value="">all</option>${opt(rels,f.rel)}</select>
    <label>Search</label><input type="text" id="t-q" placeholder="name, company, title…" value="${esc(f.q)}">
    <label class="toggle"><input type="checkbox" id="t-dead" ${f.dead?'checked':''}> Show went cold / declined / wrong contact</label><button class="chipbtn" id="t-reset">Reset</button>`;
  ['t-stage','t-rel','t-q'].forEach(id=>$('#'+id).oninput=()=>{f.stage=$('#t-stage').value;f.rel=$('#t-rel').value;f.q=$('#t-q').value;renderTable();});
  $('#t-dead').onchange=()=>{f.dead=$('#t-dead').checked;renderTable();};
  $('#t-reset').onclick=()=>{Object.assign(f,{stage:'',rel:'',q:'',dead:false});renderTools();renderTable();};
}
function renderTable(){
  const q=f.q.trim().toLowerCase();
  const rows=ALL.filter(c=>{
    if(f.stage){if(c.stage!==f.stage)return false;}else if(!f.dead&&DEAD.has(c.stage))return false;
    if(f.rel&&!(c.relevance||[]).includes(f.rel))return false;
    return !q||((c.full_name||'')+' '+(c.company||'')+' '+(c.title||'')).toLowerCase().includes(q);});
  const {k,dir}=sort;
  rows.sort((x,y)=>{const A=k==='relevance'?(x.relevance||[]).join(','):(x[k]||''),B=k==='relevance'?(y.relevance||[]).join(','):(y[k]||'');return A<B?-dir:A>B?dir:0;});
  $('#count').textContent=`${rows.length} contact${rows.length===1?'':'s'}`;
  const cols=[['full_name','Name'],['company','Company'],['title','Title'],['relevance','Relevance'],['stage','Status'],['last_msg_at','Last touch'],['profile_url','LinkedIn']];
  const ncols=cols.length+2, cut='overflow:hidden;text-overflow:ellipsis';
  $('#table').innerHTML=`<thead><tr><th class="rownum">#</th><th class="xbtn"></th>${cols.map(([k,l])=>`<th data-k="${k}" title="sort">${l}</th>`).join('')}</tr></thead><tbody>`+
    rows.map((c,i)=>{const x=expanded===c.key,dirn=c.last_msg_direction==='incoming'?'← them':c.last_msg_direction==='outgoing'?'→ you':'';
      return `<tr><td class="rownum">${i+1}</td><td class="xbtn" data-x="${esc(c.key)}" title="notes, message counts">${x?'▾':'▸'}</td>
        <td style="font-weight:700;white-space:nowrap">${esc(c.full_name)}${c.important?' ★':''}${c.needs_reply?' <span class="due-tag">reply</span>':''}</td>
        <td style="max-width:220px;${cut}" title="${esc(c.company)}">${esc(c.company)||'—'}</td>
        <td style="max-width:280px;${cut}" title="${esc(c.title)}">${esc(c.title)||'—'}</td>
        <td style="font-size:11.5px">${esc((c.relevance||[]).join(', '))||'—'}</td>
        <td><select class="mini ${stCls(c.stage)}" data-st="${esc(c.key)}">${STAGES.map(s=>`<option ${s===c.stage?'selected':''}>${s}</option>`).join('')}</select></td>
        <td class="mono" style="font-size:12px">${esc(day(c.last_msg_at))||'—'} <span style="color:var(--faint)">${dirn}</span></td>
        <td style="text-align:center">${c.profile_url?`<a href="${esc(c.profile_url)}" target="_blank" rel="noopener">↗</a>`:'—'}</td></tr>`
      +(x?`<tr class="xrow"><td colspan="${ncols}"><div class="xgrid">
        <div><h4>History</h4><div class="kv"><span class="k">Connected</span><span class="mono">${esc(day(c.connected_on))||'—'}</span>
          <span class="k">Messages</span><span class="mono">${c.msg_sent||0} sent · ${c.msg_recv||0} received</span>
          <span class="k">Last invite</span><span class="mono">${esc(day(c.last_invite_at))||'—'}</span>
          <span class="k">Follow-up</span><span class="mono">${esc(c.follow_up_date)||'—'}</span>
          <span class="k">POC secured</span><span>${c.poc_secured?'yes':'no'}</span>
          <span class="k">Tags</span><span>${esc((c.tags||[]).join(', '))||'—'}</span></div></div>
        <div><h4>Notes</h4><div style="font-size:13px;font-weight:500;white-space:pre-wrap">${esc(c.notes)||'—'}</div></div></div></td></tr>`:'');}).join('')+`</tbody>`;
  $$('#table [data-x]').forEach(b=>b.onclick=()=>{expanded=expanded===b.dataset.x?null:b.dataset.x;renderTable();});
  $$('#table [data-st]').forEach(sel=>{const prev=sel.value;sel.onchange=()=>{sel.className='mini '+stCls(sel.value);doStage(sel.dataset.st,sel.value,sel,prev);};});
  $$('#table th[data-k]').forEach(t=>t.onclick=()=>{const k=t.dataset.k;sort.dir=sort.k===k?-sort.dir:1;sort.k=k;renderTable();});
}
boot();
</script></body></html>
